<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>JavaScript Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131d;
      color: #f4f5fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 0%, rgb(98 83 199 / 18%), transparent 48%),
        #10131d;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 24px;
      border: 1px solid rgb(255 255 255 / 8%);
      border-radius: 28px;
      background: #191d2a;
      box-shadow: 0 24px 70px rgb(0 0 0 / 38%);
    }

    .heading {
      margin: 0 0 20px;
      color: #aeb4c7;
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-align: center;
      text-transform: uppercase;
    }

    .display {
      display: flex;
      min-height: 112px;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 10px 4px 22px;
      text-align: right;
    }

    .expression {
      min-height: 22px;
      overflow: hidden;
      color: #9299ad;
      font-size: 0.9rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #output {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f7f7fb;
      font: inherit;
      font-size: clamp(2.6rem, 13vw, 3.5rem);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    button {
      min-height: 62px;
      border: 0;
      border-radius: 18px;
      background: #272c3b;
      color: #f4f5fb;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 550;
      transition: background 140ms ease, transform 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #343a4b;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 2px solid #a99bff;
      outline-offset: 3px;
    }

    button.utility {
      background: #34394a;
      color: #c9cde0;
    }

    button.operator {
      background: #292644;
      color: #bdb1ff;
    }

    button.operator[aria-pressed="true"] {
      background: #7866db;
      color: white;
    }

    button.equals {
      background: #806ce8;
      color: white;
    }

    button.equals:hover {
      background: #927ff0;
    }

    button.zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 26px;
    }

    .hint {
      margin: 18px 0 0;
      color: #7f879c;
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 380px) {
      .calculator {
        padding: 20px;
      }

      .keys {
        gap: 9px;
      }

      button {
        min-height: 58px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1 class="heading">Calculator</h1>
    <div class="display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <input id="output" type="text" value="0" aria-label="Calculator display" readonly>
    </div>

    <form id="calc_form" class="keys" aria-label="Calculator keys">
      <button class="utility" type="button" data-type="clear" value="clear">AC</button>
      <button class="utility" type="button" data-type="operator" value="invert" aria-label="Change sign">+/−</button>
      <button class="utility" type="button" data-type="operator" value="%" aria-label="Percent">%</button>
      <button class="operator" type="button" data-type="operator" value="/" aria-label="Divide">÷</button>

      <button type="button" data-type="operand" value="7">7</button>
      <button type="button" data-type="operand" value="8">8</button>
      <button type="button" data-type="operand" value="9">9</button>
      <button class="operator" type="button" data-type="operator" value="*" aria-label="Multiply">×</button>

      <button type="button" data-type="operand" value="4">4</button>
      <button type="button" data-type="operand" value="5">5</button>
      <button type="button" data-type="operand" value="6">6</button>
      <button class="operator" type="button" data-type="operator" value="-" aria-label="Subtract">−</button>

      <button type="button" data-type="operand" value="1">1</button>
      <button type="button" data-type="operand" value="2">2</button>
      <button type="button" data-type="operand" value="3">3</button>
      <button class="operator" type="button" data-type="operator" value="+" aria-label="Add">+</button>

      <button class="zero" type="button" data-type="operand" value="0">0</button>
      <button type="button" data-type="operand" value="." aria-label="Decimal point">.</button>
      <button class="equals" type="button" data-type="operator" value="=" aria-label="Equals">=</button>
    </form>
    <p class="hint">Use your keyboard or click the keys</p>
  </main>

  <script>
    const form = document.querySelector("#calc_form");
    const output = document.querySelector("#output");
    const expression = document.querySelector("#expression");

    let displayValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let startNewNumber = true;

    function render() {
      output.value = displayValue;
      expression.textContent = pendingOperator && storedValue !== null
        ? `${formatNumber(storedValue)} ${operatorSymbol(pendingOperator)}`
        : "";

      form.querySelectorAll('[data-type="operator"]').forEach((button) => {
        button.setAttribute(
          "aria-pressed",
          String(button.value === pendingOperator)
        );
      });
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) return "Error";
      return String(Number(number.toPrecision(12)));
    }

    function operatorSymbol(operator) {
      return { "*": "×", "/": "÷", "-": "−", "+": "+" }[operator] || operator;
    }

    function calculate(left, operator, right) {
      switch (operator) {
        case "+":
          return left + right;
        case "-":
          return left - right;
        case "*":
          return left * right;
        case "/":
          return right === 0 ? NaN : left / right;
        default:
          return right;
      }
    }

    function enterDigit(value) {
      if (displayValue === "Error") displayValue = "0";

      if (value === ".") {
        if (startNewNumber) {
          displayValue = "0.";
          startNewNumber = false;
        } else if (!displayValue.includes(".")) {
          displayValue += ".";
        }
      } else if (startNewNumber || displayValue === "0") {
        displayValue = value;
        startNewNumber = false;
      } else {
        displayValue += value;
      }
      render();
    }

    function enterOperator(value) {
      if (displayValue === "Error") return;

      if (value === "invert") {
        if (displayValue !== "0") {
          displayValue = formatNumber(-Number(displayValue));
        }
        render();
        return;
      }

      if (value === "%") {
        displayValue = formatNumber(Number(displayValue) / 100);
        render();
        return;
      }

      if (value === "=") {
        if (pendingOperator && storedValue !== null && !startNewNumber) {
          displayValue = formatNumber(
            calculate(storedValue, pendingOperator, Number(displayValue))
          );
          storedValue = null;
          pendingOperator = null;
          startNewNumber = true;
          render();
        }
        return;
      }

      if (pendingOperator && storedValue !== null && !startNewNumber) {
        displayValue = formatNumber(
          calculate(storedValue, pendingOperator, Number(displayValue))
        );
      }

      storedValue = Number(displayValue);
      pendingOperator = value;
      startNewNumber = true;
      render();
    }

    function clear() {
      displayValue = "0";
      storedValue = null;
      pendingOperator = null;
      startNewNumber = true;
      render();
    }

    form.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      event.preventDefault();

      if (button.dataset.type === "clear") {
        clear();
      } else if (button.dataset.type === "operand") {
        enterDigit(button.value);
      } else if (button.dataset.type === "operator") {
        enterOperator(button.value);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9.]$/.test(event.key)) {
        enterDigit(event.key);
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        enterOperator(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        enterOperator("=");
      } else if (event.key === "%") {
        enterOperator("%");
      } else if (event.key === "Escape" || event.key === "Delete") {
        clear();
      } else if (event.key === "Backspace" && displayValue !== "Error") {
        if (startNewNumber || displayValue.length <= 1 || (displayValue.length === 2 && displayValue.startsWith("-"))) {
          displayValue = "0";
          startNewNumber = true;
        } else {
          displayValue = displayValue.slice(0, -1);
        }
        render();
      }
    });

    render();
  </script>
</body>
</html>
